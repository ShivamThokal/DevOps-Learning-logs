<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker>
<style>.t{font:bold 27px Arial;fill:#0f172a}.h{font:bold 19px Arial;fill:#0f172a}.p{font:16px Arial;fill:#334155}.s{font:14px Arial;fill:#475569}.b{stroke-width:2;rx:14}.l{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="560" fill="#fff"/><text x="600" y="48" text-anchor="middle" class="t">EFS Mounting Workflow</text>
<g>
<rect x="55" y="115" width="210" height="130" class="b" fill="#eff6ff" stroke="#60a5fa"/><text x="160" y="155" text-anchor="middle" class="h">1. Create EFS</text><text x="160" y="185" text-anchor="middle" class="p">Choose VPC</text><text x="160" y="210" text-anchor="middle" class="p">Create mount targets</text>
<rect x="330" y="115" width="210" height="130" class="b" fill="#fff7ed" stroke="#fb923c"/><text x="435" y="155" text-anchor="middle" class="h">2. Security group</text><text x="435" y="185" text-anchor="middle" class="p">Inbound TCP 2049</text><text x="435" y="210" text-anchor="middle" class="p">Source: EC2 SG</text>
<rect x="605" y="115" width="210" height="130" class="b" fill="#f5f3ff" stroke="#8b5cf6"/><text x="710" y="155" text-anchor="middle" class="h">3. Install client</text><text x="710" y="185" text-anchor="middle" class="p">Ubuntu: nfs-common</text><text x="710" y="210" text-anchor="middle" class="p">AL: nfs-utils</text>
<rect x="880" y="115" width="260" height="130" class="b" fill="#f0fdf4" stroke="#22c55e"/><text x="1010" y="155" text-anchor="middle" class="h">4. Create mount point</text><text x="1010" y="190" text-anchor="middle" class="p">sudo mkdir -p /mnt/efs</text>
<path d="M265 180 H325 M540 180 H600 M815 180 H875" class="l"/>
<rect x="210" y="335" width="330" height="135" class="b" fill="#ecfeff" stroke="#06b6d4"/><text x="375" y="375" text-anchor="middle" class="h">5. Mount EFS</text><text x="375" y="408" text-anchor="middle" class="p">DNS name or mount-target IP</text><text x="375" y="435" text-anchor="middle" class="s">NFSv4.1 • TCP 2049</text>
<rect x="660" y="335" width="330" height="135" class="b" fill="#dcfce7" stroke="#16a34a"/><text x="825" y="375" text-anchor="middle" class="h">6. Verify shared storage</text><text x="825" y="408" text-anchor="middle" class="p">mount • df -hT • touch</text><text x="825" y="435" text-anchor="middle" class="s">Repeat from another EC2 instance</text>
<path d="M1010 245 V285 H375 V330" class="l"/><path d="M540 402 H655" class="l"/>
<text x="600" y="520" text-anchor="middle" class="s">Optional: add a persistent /etc/fstab entry using _netdev</text>
</g></svg>